name: utaustin_mutex
source: utaustin_mutex
action:
  - {from: action, dims: [0, 1, 2, 3, 4, 5], kind: delta}
  - {from: action, dims: [6], kind: discrete}
state:
  - {from: observation.state}
cameras:
