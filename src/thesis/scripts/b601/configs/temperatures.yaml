#   ./src/thesis/scripts/b601/temperatures.sh
#   ./src/thesis/scripts/b601/temperatures.sh watch=true interval=5
#   ./src/thesis/scripts/b601/temperatures.sh watch=true duration=600

defaults:
  - temperatures_schema
  - _self_
